<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Luyện Tập Chuyên Sâu</title>

    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #C62828;
            --secondary-color: #F9A825;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #333;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(198, 40, 40, 0.4) 100%); z-index: -1; }

        /* HEADER */
        .header { width: 100%; padding: 15px 30px; background: rgba(0, 0, 0, 0.5); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary-color); backdrop-filter: blur(5px); }
        .brand-title { font-size: 1.8rem; font-weight: 800; color: var(--secondary-color); margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .brand-title span { font-family: 'Ma Shan Zheng', cursive; font-size: 2.2rem; color: #FFD54F; margin-right: 10px; }
        .calligraphy { font-family: 'Ma Shan Zheng', cursive; font-size: 3rem; color: #FFD54F; text-shadow: 3px 3px 8px rgba(0,0,0,0.9); margin: 0; }

        /* LAYOUT */
        .main-layout { display: flex; width: 100%; max-width: 1200px; margin: 20px auto; padding: 0 20px; gap: 20px; }

        /* SIDEBAR */
        .sidebar { width: 300px; flex-shrink: 0; background: var(--bg-glass); border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-top: 5px solid var(--primary-color); max-height: calc(100vh - 100px); overflow-y: auto; }
        .sidebar h3 { color: var(--primary-color); margin-top: 0; border-bottom: 2px dashed #ccc; padding-bottom: 10px; font-size: 1.1rem; }

        .tree-children { list-style: none; padding-left: 0; margin: 0; }
        .tree-item { padding: 10px; margin: 6px 0; border-radius: 8px; cursor: pointer; color: #555; transition: all 0.2s; font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid #eee; }
        .tree-item:hover { background: #FFF3E0; color: var(--primary-color); border-color: var(--secondary-color); }
        .tree-item.active { background: var(--primary-color); color: white; border-color: var(--primary-color); box-shadow: 0 2px 8px rgba(198,40,40,0.4); }
        .tree-item .badge { background: #ddd; color: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
        .tree-item.active .badge { background: white; color: var(--primary-color); }

        /* CONTENT AREA */
        .content-area { flex: 1; background: var(--bg-glass); border-radius: 20px; padding: 30px 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border-top: 5px solid var(--secondary-color); }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h2 { color: var(--primary-color); margin: 0; font-size: 1.4rem; }
        .progress-box { background: #f1f3f4; padding: 10px 15px; border-radius: 8px; font-weight: bold; color: #555; display: inline-block; margin-bottom: 20px; }
        .score { color: #2E7D32; margin-left: 15px; }
        .question { font-size: 1.3rem; margin: 20px 0; color: #111; font-weight: 700; line-height: 1.5; }

        .option { display: flex; align-items: center; width: 100%; padding: 15px 20px; margin: 10px 0; background: #fff; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; }
        .option:hover:not(:disabled) { background: #FFF8E1; border-color: var(--secondary-color); transform: translateX(5px); }
        .option .letter { font-weight: 800; color: var(--primary-color); margin-right: 15px; }
        .option.correct { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; font-weight: bold; }
        .option.wrong { background: #FFEBEE; border-color: #F44336; color: #B71C1C; }

        #explanation { margin-top: 20px; padding: 15px; background: #FFF3E0; border-left: 5px solid var(--primary-color); border-radius: 8px; color: #E65100; display: none; }
        #next-btn { margin-top: 25px; width: 100%; padding: 15px; background: linear-gradient(135deg, var(--primary-color) 0%, #E53935 100%); color: white; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; display: none; }

        @media (max-width: 800px) {
            .main-layout { flex-direction: column; }
            .sidebar { width: 100%; max-height: none; }
            .header { flex-direction: column; text-align: center; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="header">
        <h1 class="brand-title"><span>小芳</span> Chinese HSK 3.0</h1>
        <h1 class="calligraphy">走进中国</h1>
    </div>

    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>📚 Chọn Bài Học</h3>
            <select id="lesson-select" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold;" onchange="changeLesson(this.value)">
                <!-- Tự động tạo 15 bài -->
            </select>

            <h3>🎯 Các Phần Luyện Tập</h3>
            <div id="exercise-menu">
                <!-- Menu sẽ được JS tạo -->
            </div>
        </div>

        <!-- CONTENT -->
        <div class="content-area">
            <div class="top-bar">
                <h2 id="lesson-title">Đang tải...</h2>
            </div>

            <div class="progress-box">
                Câu: <span id="q-num">1</span> / <span id="total-q">0</span>
                <span class="score">Đúng: <span id="score-display">0</span></span>
            </div>

            <div class="question" id="question-text"></div>
            <div id="options-container"></div>
            <div id="explanation"></div>
            <button id="next-btn" onclick="nextQuestion()">Câu tiếp theo ➔</button>
        </div>
    </div>

    <script>

        // Đảm bảo vị trí đáp án A, B, C, D ngẫu nhiên 25%
        // ==========================================
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

                ["Từ '火车' (huǒchē) nghĩa là:", ["Tàu hỏa", "Máy bay", "Ô tô", "Xe đạp"], "Tàu hỏa", "火车 là tàu hỏa."],

                ["Hỏi 'Bạn đi đâu?'", ["你去哪儿？", "你去哪？", "你去哪里吗？", "你去哪儿了？"], "你去哪儿？", "哪儿 là đại từ nghi vấn chỉ địa điểm."],

                ["Từ '去年' (qùnián) nghĩa là:", ["Năm ngoái", "Năm nay", "Năm sau", "Năm kia"], "Năm ngoái", "去 (đi qua) + 年 (năm) = Năm ngoái."],

                ["'机场' (jīchǎng) nghĩa là:", ["Sân bay", "Ga tàu", "Bến xe", "Bến cảng"], "Sân bay", "机场 là sân bay."],
                ["Câu '北京很漂亮' nghĩa là gì?", ["Bắc Kinh rất đẹp", "Bắc Kinh rất to", "Bắc Kinh rất lạnh", "Bắc Kinh rất đông"], "Bắc Kinh rất đẹp", "漂亮 nghĩa là đẹp."],
                ["Từ '接' (jiē) nghĩa là:", ["Đón", "Tiễn", "Gặp", "Chờ"], "Đón", "接 là đón (ai đó)."],
                ["'好玩儿' (hǎowánr) nghĩa là:", ["Vui", "Buồn", "Đẹp", "Xấu"], "Vui", "好玩儿 nghĩa là thú vị, vui vẻ."],
                ["Hỏi 'Bạn có thời gian không?'", ["你有时间吗？", "你有空吗？", "你忙吗？", "你累吗？"], "你有时间吗？", "时间 nghĩa là thời gian."]
            ]
        };

        let currentLessonData = null;
        let filteredQuestions = [];
        let currentQuestionIndex = 0;
        let correctAnswersCount = 0;
        let isAnswered = false;
        let currentType = "all";
        let currentLessonId = 1;

        // Tạo danh sách 15 bài
        const lessonSelect = document.getElementById('lesson-select');
        for(let i = 1; i <= 15; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `📖 Bài ${i}`;
            lessonSelect.appendChild(opt);
        }

        // Vẽ Menu
        function updateSidebarMenu() {
            const menuContainer = document.getElementById('exercise-menu');
            menuContainer.innerHTML = '';

            let count = {
                meaning: currentLessonData.questions.filter(q => q.type === "meaning").length,
                pinyin: currentLessonData.questions.filter(q => q.type === "pinyin").length,
                fill_blank: currentLessonData.questions.filter(q => q.type === "fill_blank").length,
                translate: currentLessonData.questions.filter(q => q.type === "translate").length,
                grammar: currentLessonData.questions.filter(q => q.type === "grammar").length
            };
            let total = currentLessonData.questions.length;

            const menus = [
                { id: "all", label: "🏆 Làm tất cả (Full Test)", count: total },
                { id: "meaning", label: "1️⃣ Từ vựng (Nghĩa)", count: count.meaning },
                { id: "pinyin", label: "2️⃣ Phát âm (Pinyin)", count: count.pinyin },
                { id: "fill_blank", label: "3️⃣ Điền từ vào câu", count: count.fill_blank },
                { id: "translate", label: "4️⃣ Dịch câu (Khó)", count: count.translate },
                { id: "grammar", label: "5️⃣ Phản xạ Ngữ pháp", count: count.grammar }
            ];

            menus.forEach(menu => {
                let div = document.createElement('div');
                div.className = `tree-item ${currentType === menu.id ? 'active' : ''}`;
                div.innerHTML = `<span>${menu.label}</span> <span class="badge">${menu.count}</span>`;
                div.onclick = () => selectExerciseType(menu.id);
                menuContainer.appendChild(div);
            });
        }

        // Chọn phần
        function selectExerciseType(type) {
            currentType = type;
            filterQuestions();
            updateSidebarMenu();
            renderQuestion();
        }

        // Đổi Bài
        function changeLesson(lessonId) {
            currentLessonId = parseInt(lessonId);
            currentQuestionIndex = 0;
            correctAnswersCount = 0;
            document.getElementById('score-display').innerText = `0`;
            currentType = "all";

            fetch(`hsk1_data/lesson_${lessonId}.json`)
                .then(res => res.json())
                .then(data => {
                    currentLessonData = data;
                    document.getElementById('lesson-title').innerText = currentLessonData.lessonTitle;

                    // GHI ĐÈ 15 CÂU DỊCH BẰNG KHO CÂU CHUẨN (LẤY MẪU KHÔNG HOÀN LẠI)
                    let transBank = TRANSLATION_BANK[currentLessonId];
                    let transQuestions = currentLessonData.questions.filter(q => q.type === "translate");
                    let shuffledTrans = [...transBank].sort(() => Math.random() - 0.5);

                    transQuestions.forEach((q, index) => {
                        let pair = shuffledTrans[index % shuffledTrans.length];

                        q.question = `Dịch câu sau sang tiếng Trung: '${pair[0]}'`;
                        q.answer = pair[1];

                        // Tạo đáp án sai (Chỉ dùng tiếng Trung, không chèn tiếng Việt)
                        let opts = [pair[1]];
                        let reversed = pair[1].split('').reverse().join('');
                        if (reversed !== pair[1]) opts.push(reversed);

                        if (pair[1].startsWith("我")) {
                            opts.push("是" + pair[1].substring(1));
                            opts.push("不" + pair[1]);
                        } else {
                            opts.push("我" + pair[1]);
                            opts.push("是" + pair[1]);
                        }

                        opts = [...new Set(opts)];
                        while(opts.length < 4) opts.push("是" + pair[1]);

                        // SỬ DỤNG THUẬT TOÁN XÁO BÀI CHUẨN
                        q.options = shuffleArray(opts.slice(0, 4));
                        q.explanation = `Câu đúng là: ${pair[1]}`;
                    });

                    // GHI ĐÈ 10 CÂU NGỮ PHÁP BẰNG KHO CÂU CHUẨN
                    let gramBank = GRAMMAR_BANK[currentLessonId];
                    let gramQuestions = currentLessonData.questions.filter(q => q.type === "grammar");
                    let shuffledGram = [...gramBank].sort(() => Math.random() - 0.5);

                    gramQuestions.forEach((q, index) => {
                        let item = shuffledGram[index % shuffledGram.length];
                        q.question = item[0];
                        // SỬ DỤNG THUẬT TOÁN XÁO BÀI CHUẨN CHO CẢ CÂU NGỮ PHÁP
                        q.options = shuffleArray([...item[1]]);
                        q.answer = item[2];
                        q.explanation = item[3];
                    });

                    filterQuestions();
                    updateSidebarMenu();
                    renderQuestion();
                })
                .catch(err => alert("Lỗi tải file JSON!"));
        }

        // Lọc
        function filterQuestions() {
            if (currentType === "all") {
                filteredQuestions = [...currentLessonData.questions];
            } else {
                filteredQuestions = currentLessonData.questions.filter(q => q.type === currentType);
            }
            currentQuestionIndex = 0;
            correctAnswersCount = 0;
            document.getElementById('score-display').innerText = `0`;
            document.getElementById('total-q').innerText = filteredQuestions.length;
        }

        // Render
        function renderQuestion() {
            isAnswered = false;
            if (filteredQuestions.length === 0) return;

            const q = filteredQuestions[currentQuestionIndex];
            document.getElementById('q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.innerHTML = `<span class="letter">${letters[index]}.</span> ${option}`;
                btn.onclick = () => checkAnswer(btn, option, q.answer, q.explanation);
                optionsContainer.appendChild(btn);
            });
        }

        // Check
        function checkAnswer(btn, selected, correct, explanation) {
            if (isAnswered) return;
            isAnswered = true;

            const allBtns = document.querySelectorAll('.option');
            allBtns.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                correctAnswersCount++;
                document.getElementById('score-display').innerText = correctAnswersCount;
            } else {
                btn.classList.add('wrong');
                allBtns.forEach(b => {
                    const btnText = b.innerText.substring(3).trim();
                    if (btnText === correct) b.classList.add('correct');
                });
            }

            const expDiv = document.getElementById('explanation');
            expDiv.innerHTML = `<strong>💡 Giải thích:</strong> ${explanation}`;
            expDiv.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        // Next
        function nextQuestion() {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                alert(`🎉 Chúc mừng bạn đã hoàn thành!\nSố câu đúng: ${correctAnswersCount}/${filteredQuestions.length}`);
            }
        }

        // Khởi chạy
        changeLesson(1);
    </script>
