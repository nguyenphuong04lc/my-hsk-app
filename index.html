<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1, 2, 3 - Luyện Tập Chuyên Sâu</title>

    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #1976D2;
            --secondary-color: #FFB300;
            --bg-glass: rgba(255, 255, 255, 0.98);
            --text-color: #333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Nunito', 'Noto Sans SC', sans-serif;
            margin: 0; padding: 0; min-height: 100vh;
            background-image: url('https://images.unsplash.com/photo-1508804185872-d7badad00f7d?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--text-color);
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.7) 0%, rgba(25, 118, 210, 0.5) 100%); z-index: -1; }

        /* HEADER */
        .header { width: 100%; padding: 15px 30px; background: rgba(0, 0, 0, 0.6); display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--secondary-color); backdrop-filter: blur(8px); }
        .brand-title { font-size: 1.8rem; font-weight: 800; color: var(--secondary-color); margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .brand-title span { font-family: 'Ma Shan Zheng', cursive; font-size: 2.2rem; color: #FFF; margin-right: 10px; }
        .calligraphy { font-family: 'Ma Shan Zheng', cursive; font-size: 3rem; color: var(--secondary-color); text-shadow: 3px 3px 8px rgba(0,0,0,0.9); margin: 0; }
        /* CSS cho dòng chữ Facebook ở giữa */
                .header-center-link {
            color: #000; /* Chữ màu đen */
            font-size: 1rem;
            font-weight: 800;
            text-decoration: none;
            background: var(--secondary-color); /* Nền màu vàng cam */
            padding: 8px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(255, 179, 0, 0.4);
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-center-link:hover {
            background: #FFA000; /* Vàng đậm hơn khi hover */
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 15px rgba(255, 179, 0, 0.6);
        }
        /* LAYOUT - Đã sửa để tràn đầy màn hình, sát mép trái/phải */
        .main-layout { display: flex; width: 100%; margin: 20px 0; padding: 0 20px; gap: 20px; }

        /* SIDEBAR */
        .sidebar { width: 320px; flex-shrink: 0; background: var(--bg-glass); border-radius: 15px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-top: 5px solid var(--primary-color); max-height: calc(100vh - 100px); overflow-y: auto; }

        /* ẢNH PROFILE XIAOFANG */
        .profile-container {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px dashed #ccc;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--secondary-color);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }
        .profile-img:hover {
            transform: scale(1.05) rotate(5deg);
        }
        .profile-name {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary-color);
            font-family: 'Noto Sans SC', sans-serif;
        }
        .profile-title {
            font-size: 0.85rem;
            color: #777;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .sidebar h3 { color: var(--primary-color); margin-top: 0; border-bottom: 2px dashed #ccc; padding-bottom: 10px; font-size: 1.1rem; }

        .level-selector select { width: 100%; padding: 10px; border-radius: 8px; border: 2px solid var(--primary-color); font-weight: bold; font-size: 1rem; color: var(--primary-color); cursor: pointer; outline: none; margin-bottom: 15px;}
        select#lesson-select { width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; font-size: 1rem; cursor: pointer; outline: none; }

        .tree-children { list-style: none; padding-left: 0; margin: 0; }
        .tree-item { padding: 12px; margin: 8px 0; border-radius: 8px; cursor: pointer; color: #555; transition: all 0.2s; font-weight: 600; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; border: 1px solid #eee; }
        .tree-item:hover { background: #E3F2FD; color: var(--primary-color); border-color: var(--primary-color); transform: translateX(3px); }
        .tree-item.active { background: var(--primary-color); color: white; border-color: var(--primary-color); box-shadow: 0 4px 10px rgba(25,118,210,0.4); }
        .tree-item .badge { background: #ddd; color: #333; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: bold;}
        .tree-item.active .badge { background: white; color: var(--primary-color); }

        /* CONTENT AREA */
        .content-area { flex: 1; background: var(--bg-glass); border-radius: 20px; padding: 30px 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-top: 5px solid var(--secondary-color); display: flex; flex-direction: column; position: relative;}

        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { color: var(--primary-color); margin: 0; font-size: 1.4rem; }

        /* THANH TIẾN TRÌNH */
        .progress-container { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; background: #f1f3f4; padding: 10px 15px; border-radius: 10px; }
        .progress-bar-bg { flex: 1; height: 10px; background: #e0e0e0; border-radius: 5px; margin: 0 15px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--primary-color); width: 0%; transition: width 0.3s ease; }
        .stats { font-weight: bold; color: var(--text-color); font-size: 0.95rem; white-space: nowrap;}
        .stats .score { color: #2E7D32; margin-left: 10px; }

        /* CỘT BÊN PHẢI CHỨA CÂU HỎI VÀ NÚT */
        .question-layout { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
        .question-main { flex: 1; }
        .question { font-size: 1.4rem; color: #111; font-weight: 700; line-height: 1.6; white-space: pre-line; }

        .right-action-column { display: flex; flex-direction: column; gap: 10px; width: 140px; flex-shrink: 0; position: sticky; top: 20px;}

        .icon-btn { background: #E3F2FD; border: none; color: var(--primary-color); padding: 12px 15px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; width: 100%;}
        .icon-btn:hover { background: #BBDEFB; transform: scale(1.05); }
        .icon-btn:active { transform: scale(0.95); }

        .playing { animation: pulse 1s infinite alternate; background: #FFCDD2 !important; color: #B71C1C !important; }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.6; } }

        .hint-text { display: none; margin-top: 10px; color: #E65100; font-style: italic; font-size: 0.95rem; background: #FFF3E0; padding: 10px; border-radius: 8px; border-left: 4px solid #FF9800; margin-bottom: 20px;}

        /* KHU VỰC ĐÁP ÁN */
        .option { display: flex; align-items: center; width: 100%; padding: 18px 20px; margin: 12px 0; background: #fff; border: 2px solid #e0e0e0; border-radius: 12px; cursor: pointer; font-size: 1.15rem; transition: all 0.2s; text-align: left; position: relative;}
        .option:hover:not(:disabled) { background: #E3F2FD; border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .option .letter { font-weight: 800; color: var(--primary-color); margin-right: 15px; font-size: 1.3rem;}
        .option .content { display: flex; flex-direction: column; }
        .option .pinyin { font-size: 0.9rem; color: #666; font-weight: normal; margin-top: 4px; font-style: italic; }

        .option.correct { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; font-weight: bold; }
        .option.wrong { background: #FFEBEE; border-color: #F44336; color: #B71C1C; }

        .option-audio-icon { margin-left: auto; color: #1976D2; font-size: 1.3rem; padding: 8px; border-radius: 50%; transition: background 0.2s; background: #f0f7ff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer;}
        .option-audio-icon:hover { background: #BBDEFB; transform: scale(1.1);}

        #explanation { margin-top: 20px; padding: 15px; background: #FFF3E0; border-left: 5px solid var(--secondary-color); border-radius: 8px; color: #E65100; display: none; font-weight: 500; font-size: 1.05rem; line-height: 1.5; margin-bottom: 20px;}

        /* NÚT CÂU TIẾP THEO */
        #next-btn {
            background: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            transition: all 0.2s;
            box-shadow: 0 6px 15px rgba(25,118,210,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 15px 10px;
            width: 100%;
        }
        #next-btn:hover { background: #1565C0; transform: scale(1.05); }
        #next-btn .arrow { font-size: 1.5rem; }

        .bottom-spacer { flex: 1; min-height: 20px; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 800px) {
            .header { flex-direction: column; text-align: center; gap: 10px; padding: 15px; }
            .main-layout { flex-direction: column; padding: 10px; }
            .sidebar { width: 100%; max-height: none; display: flex; flex-wrap: wrap; gap: 10px; padding: 15px; }
            .sidebar h3 { width: 100%; margin: 5px 0; border: none; padding: 0;}
            .level-selector { flex: 1; min-width: 120px; margin: 0;}
            #lesson-select { flex: 1; min-width: 120px; margin: 0;}
            #exercise-menu { display: flex; flex-wrap: wrap; width: 100%; gap: 5px; }
            .tree-item { flex: 1 1 45%; padding: 8px; margin: 0; font-size: 0.85rem; justify-content: center; }
            .tree-item .badge { display: none; }

            .content-area { padding: 20px 15px; }
            .question-layout { flex-direction: column; gap: 15px;}
            .right-action-column { flex-direction: row; width: 100%; justify-content: space-between; position: static;}
            .icon-btn { flex: 1; }

            #next-btn { position: fixed; bottom: 20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; flex-direction: column; padding: 0; z-index: 100; font-size: 0.9rem;}
            #next-btn .arrow { font-size: 1.5rem; margin-top: -5px;}

            .option { padding: 15px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>

        <div class="header">
        <h1 class="brand-title"><span>小芳</span> Chinese HSK 3.0</h1>

        <!-- Dòng chữ Facebook thêm vào giữa -->
        <a href="https://facebook.com/" target="_blank" class="header-center-link">
            Facebook: Nguyễn Phương
        </a>

        <h1 class="calligraphy">走进中国</h1>
    </div>

    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar">

            <!-- HÌNH ẢNH XIAOFANG -->
            <div class="profile-container">
                <img src="xiaofang.jpg" alt="小芳 - Xiaofang" class="profile-img">
                <div class="profile-name">小芳 (Xiaofang)</div>
                <div class="profile-title">HSK 3.0 Instructor</div>
            </div>

            <h3>🎓 Cấp Độ</h3>
            <div class="level-selector">
                <select id="level-select" onchange="changeLevel(this.value)">
                    <option value="1">HSK 1</option>
                    <option value="2">HSK 2</option>
                    <option value="3">HSK 3</option>
                </select>
            </div>

            <h3>📚 Bài Học</h3>
            <select id="lesson-select" onchange="changeLesson(this.value)"></select>

            <h3>🎯 Phần Luyện Tập</h3>
            <div id="exercise-menu"></div>
        </div>

        <!-- CONTENT -->
        <div class="content-area">
            <div class="top-bar">
                <h2 id="lesson-title">Đang tải...</h2>
            </div>

            <div class="progress-container">
                <div class="stats">Câu: <span id="q-num">1</span> / <span id="total-q">0</span></div>
                <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
                <div class="stats">Đúng: <span class="score" id="score-display">0</span></div>
            </div>

            <div class="question-layout">
                <div class="question-main">
                    <div class="question" id="question-text">Vui lòng chọn bài học...</div>
                    <div class="hint-text" id="hint-text"></div>
                </div>

                <div class="right-action-column">
                    <button class="icon-btn" onclick="toggleHint()" title="Xem gợi ý">💡 Gợi ý</button>
                    <button class="icon-btn" id="btn-speak-question" onclick="speakQuestion(this)" title="Nghe phát âm tiếng Trung" style="display:none;">🔊 Đọc</button>
                    <button id="next-btn" onclick="nextQuestion()">
                        <span>Câu tiếp</span>
                        <span class="arrow">➔</span>
                    </button>
                </div>
            </div>

            <div id="options-container"></div>
            <div id="explanation"></div>

            <div class="bottom-spacer"></div>
        </div>
    </div>

    <script>
        let currentLevel = 1;
        let currentLessonId = 1;
        let currentLessonData = null;
        let filteredQuestions = [];
        let currentQuestionIndex = 0;
        let correctAnswersCount = 0;
        let isAnswered = false;
        let currentType = "all";

        const lessonSelect = document.getElementById('lesson-select');

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initLevels() {
            changeLevel(1);
        }

        function changeLevel(level) {
            currentLevel = parseInt(level);
            currentLessonId = 1;
            currentType = "all";

            lessonSelect.innerHTML = '';
            let maxLessons = 15;
            if (currentLevel === 3) maxLessons = 18;

            for (let i = 1; i <= maxLessons; i++) {
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `📖 Bài ${i}`;
                lessonSelect.appendChild(opt);
            }
            changeLesson(1);
        }

        function changeLesson(lessonId) {
            currentLessonId = parseInt(lessonId);
            currentQuestionIndex = 0;
            correctAnswersCount = 0;
            document.getElementById('score-display').innerText = `0`;
            currentType = "all";

            document.getElementById('lesson-title').innerText = "Đang tải dữ liệu...";
            document.getElementById('question-text').innerText = "";
            document.getElementById('options-container').innerHTML = "";
            document.getElementById('exercise-menu').innerHTML = "";

            let url = `hsk${currentLevel}_data/lesson_${lessonId}.json`;

            fetch(url)
                .then(res => { if (!res.ok) throw new Error("Lỗi file JSON"); return res.json(); })
                .then(data => {
                    currentLessonData = data;
                    document.getElementById('lesson-title').innerText = currentLessonData.lessonTitle;
                    currentLessonData.questions = shuffleArray(currentLessonData.questions);
                    filterQuestions();
                    updateSidebarMenu();
                    renderQuestion();
                })
                .catch(err => {
                    document.getElementById('lesson-title').innerText = "Chưa có dữ liệu";
                    document.getElementById('question-text').innerText = "Vui lòng chạy file generate_data.py để tạo dữ liệu mới nhất.";
                    document.getElementById('total-q').innerText = "0";
                });
        }

        function updateSidebarMenu() {
            const menuContainer = document.getElementById('exercise-menu');
            menuContainer.innerHTML = '';
            if (!currentLessonData || !currentLessonData.questions) return;

            let count = { meaning: 0, pinyin: 0, fill_blank: 0, translate: 0, grammar: 0 };
            currentLessonData.questions.forEach(q => { if (count[q.type] !== undefined) count[q.type]++; });
            let total = currentLessonData.questions.length;

            const menus = [
                { id: "all", label: "🏆 Làm tất cả", count: total },
                { id: "meaning", label: "1️⃣ Từ vựng", count: count.meaning },
                { id: "pinyin", label: "2️⃣ Phát âm", count: count.pinyin },
                { id: "fill_blank", label: "3️⃣ Điền từ", count: count.fill_blank },
                { id: "translate", label: "4️⃣ Dịch câu", count: count.translate },
                { id: "grammar", label: "5️⃣ Ngữ pháp", count: count.grammar }
            ];

            menus.forEach(menu => {
                if (menu.count > 0) {
                    let div = document.createElement('div');
                    div.className = `tree-item ${currentType === menu.id ? 'active' : ''}`;
                    div.innerHTML = `<span>${menu.label}</span> <span class="badge">${menu.count}</span>`;
                    div.onclick = () => { currentType = menu.id; filterQuestions(); updateSidebarMenu(); renderQuestion(); };
                    menuContainer.appendChild(div);
                }
            });
        }

        function filterQuestions() {
            if (!currentLessonData || !currentLessonData.questions) return;
            if (currentType === "all") {
                filteredQuestions = [...currentLessonData.questions];
            } else {
                filteredQuestions = currentLessonData.questions.filter(q => q.type === currentType);
            }
            filteredQuestions = shuffleArray(filteredQuestions);
            currentQuestionIndex = 0;
            correctAnswersCount = 0;
            document.getElementById('score-display').innerText = `0`;
            document.getElementById('total-q').innerText = filteredQuestions.length;
        }

        function toggleHint() {
            const hintDiv = document.getElementById('hint-text');
            hintDiv.style.display = hintDiv.style.display === 'block' ? 'none' : 'block';
            if (hintDiv.style.display === 'block' && filteredQuestions[currentQuestionIndex]) {
                hintDiv.innerHTML = `💡 Gợi ý: ${filteredQuestions[currentQuestionIndex].explanation}`;
            }
        }

        function playTTS(text, lang, btnElement = null) {
            if ('speechSynthesis' in window && text) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = lang === 'zh-CN' ? 0.85 : 1.0;

                const voices = window.speechSynthesis.getVoices();
                let bestVoice = null;
                if (lang === 'zh-CN') {
                    bestVoice = voices.find(v => v.lang.includes('zh-CN') && (v.name.includes('Xiaoxiao') || v.name.includes('Yaoyao') || v.name.includes('Google')));
                    if (!bestVoice) bestVoice = voices.find(v => v.lang.includes('zh-CN'));
                } else if (lang === 'vi-VN') {
                    bestVoice = voices.find(v => v.lang.includes('vi-VN'));
                }
                if (bestVoice) utterance.voice = bestVoice;

                if (btnElement) {
                    btnElement.classList.add('playing');
                    utterance.onend = () => btnElement.classList.remove('playing');
                    utterance.onerror = () => btnElement.classList.remove('playing');
                }
                window.speechSynthesis.speak(utterance);
            }
        }

        const speakQuestion = debounce(function(btn) {
            const q = filteredQuestions[currentQuestionIndex];
            if (!q) return;
            const match = q.question.match(/“(.*?)”/);
            playTTS(match ? match[1] : q.answer, 'zh-CN', btn);
        }, 300);

        function speakOption(e, text) {
            e.stopPropagation();
            playTTS(text, 'zh-CN');
        }

        function renderQuestion() {
            isAnswered = false;
            document.getElementById('hint-text').style.display = 'none';
            if (filteredQuestions.length === 0) return;

            const q = filteredQuestions[currentQuestionIndex];
            document.getElementById('q-num').innerText = currentQuestionIndex + 1;
            document.getElementById('question-text').innerText = q.question;
            document.getElementById('progress-fill').style.width = `${((currentQuestionIndex) / filteredQuestions.length) * 100}%`;

            document.getElementById('btn-speak-question').style.display = /[\u4e00-\u9fa5]/.test(q.question) ? 'flex' : 'none';
            document.getElementById('options-container').innerHTML = '';
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option';

                let mainText = option;
                let pinyinText = "";
                const match = option.match(/^(.*?)\s*\((.*?)\)$/);
                if (match) {
                    mainText = match[1].trim();
                    pinyinText = match[2].trim();
                }

                let contentHtml = `<span class="letter">${letters[index]}.</span>
                                   <div class="content">
                                       <span>${mainText}</span>`;

                if (pinyinText) {
                    contentHtml += `<span class="pinyin">${pinyinText}</span>`;
                }
                contentHtml += `</div>`;

                btn.innerHTML = contentHtml;

                if (/[\u4e00-\u9fa5]/.test(option)) {
                    const icon = document.createElement('span');
                    icon.className = 'option-audio-icon';
                    icon.innerText = '🔊';
                    icon.onclick = function(e) { speakOption(e, option); };
                    btn.appendChild(icon);
                }
                btn.onclick = () => checkAnswer(btn, option, q.answer, q.explanation);
                document.getElementById('options-container').appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct, explanation) {
            if (isAnswered) return;
            isAnswered = true;
            document.querySelectorAll('.option').forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                correctAnswersCount++;
                document.getElementById('score-display').innerText = correctAnswersCount;
                if (/[\u4e00-\u9fa5]/.test(correct)) playTTS(correct, 'zh-CN');
            } else {
                btn.classList.add('wrong');
                document.querySelectorAll('.option').forEach(b => {
                    const btnText = b.innerText.replace('🔊', '').substring(3).trim();
                    if (btnText.includes(correct.split(' ')[0])) b.classList.add('correct');
                });
            }

            document.getElementById('explanation').innerHTML = `<strong>💡 Giải thích:</strong> ${explanation}`;
            document.getElementById('explanation').style.display = 'block';
            document.getElementById('next-btn').style.display = 'flex';
        }

        function nextQuestion() {
            if (currentQuestionIndex < filteredQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
                document.querySelector('.content-area').scrollIntoView({ behavior: 'smooth' });
            } else {
                document.getElementById('progress-fill').style.width = "100%";
                setTimeout(() => alert(`🎉 Chúc mừng bạn đã hoàn thành!\nSố câu đúng: ${correctAnswersCount}/${filteredQuestions.length}`), 300);
            }
        }

        window.onload = initLevels;
    </script>
</body>
</html>
